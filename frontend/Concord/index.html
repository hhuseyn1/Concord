<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Concord is where your community hangs out - servers and channels, instant messaging, crystal-clear voice & video, and presence that keeps everyone in the loop."
    />
    <title>Concord</title>
    <script>
      (function () {
        var root = document.documentElement
        var theme = null
        var fontSize = null

        try {
          theme = localStorage.getItem('concord.theme')
          fontSize = localStorage.getItem('concord.fontSize')
        } catch (error) {
        }

        if (theme !== 'dark' && theme !== 'light') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        }
        root.setAttribute('data-theme', theme)

        if (['small', 'default', 'large', 'xl'].indexOf(fontSize) === -1) fontSize = 'default'
        root.setAttribute('data-font-size', fontSize)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
